# Security: dependency review (PRs) + bundler-audit for known gem vulnerabilities
name: Security

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  bundler-audit:
    name: Bundler audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Pin the CLI gem for reproducible installs; --update refreshes the advisory DB only.
      # Gemfile.lock stays uncommitted (public library / multi-Ruby matrix policy).
      - name: Install bundler-audit
        run: gem install bundler-audit -v 0.9.3
      - name: Update vulnerability DB and run audit
        run: bundler-audit check --update
