# Security: dependency review (PRs) + bundler-audit for known gem vulnerabilities
name: Security

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@40c09b7dc99638e5ddb0bfd91c1673effc064d8a # v4.8.1
        with:
          fail-on-severity: high

  bundler-audit:
    name: Bundler audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Pin the CLI gem for reproducible installs; --update refreshes the advisory DB only.
      # Gemfile.lock stays uncommitted (public library / multi-Ruby matrix policy).
      - name: Install bundler-audit
        run: gem install bundler-audit -v 0.9.3
      - name: Update vulnerability DB and run audit
        run: bundler-audit check --update
