name: Unit tests

on:
  - pull_request
  - push

# Least privilege for fork and same-repo PR runners. No publishing secrets are used.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run unit tests
        env:
          # One matrix cell publishes the report. Other cells stay unchanged.
          COVERAGE: ${{ matrix.ruby == '3.3' && '1' || '0' }}
        run: bundle exec rake unit
      - name: Publish coverage summary
        if: matrix.ruby == '3.3'
        run: ruby script/report_coverage.rb
      - name: Upload coverage report
        if: matrix.ruby == '3.3'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ruby-3.3
          path: coverage
          if-no-files-found: error
      - name: Verify gem builds
        run: gem build *.gemspec

  test-ruby-4:
    name: Test Ruby 4.0 (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ruby 4.0
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run unit tests
        run: bundle exec rake unit
      - name: Verify gem builds
        run: gem build *.gemspec
