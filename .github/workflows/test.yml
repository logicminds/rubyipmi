name: Unit tests

on:
  - pull_request
  - push

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
    steps:
      - uses: actions/checkout@v7
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run unit tests
        env:
          # One matrix cell publishes the report. Other cells stay unchanged.
          COVERAGE: ${{ matrix.ruby == '3.3' && '1' || '0' }}
        run: bundle exec rake unit
      - name: Publish coverage summary
        if: matrix.ruby == '3.3'
        run: ruby script/report_coverage.rb
      - name: Upload coverage report
        if: matrix.ruby == '3.3'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ruby-3.3
          path: coverage
          if-no-files-found: error
      - name: Verify gem builds
        run: gem build *.gemspec

  test-ruby-4:
    name: Test Ruby 4.0 (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install Ruby 4.0
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run unit tests
        run: bundle exec rake unit
      - name: Verify gem builds
        run: gem build *.gemspec
