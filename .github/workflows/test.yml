name: Unit tests

on:
  - pull_request
  - push

jobs:
  test:
    runs-on: ubuntu-latest
    # setup-ruby plus the suite is normally under a minute. Cap a stuck
    # self-hosted runner so one matrix cell cannot hold it for hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          # Current Ruby. Same required job as 3.x: a 4.0 failure fails the workflow.
          - "4.0"
    steps:
      - uses: actions/checkout@v7
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run unit tests
        env:
          # One matrix cell publishes the report. Other cells stay unchanged.
          COVERAGE: ${{ matrix.ruby == '3.3' && '1' || '0' }}
        run: bundle exec rake unit
      - name: Publish coverage summary
        if: matrix.ruby == '3.3'
        run: ruby script/report_coverage.rb
      - name: Upload coverage report
        if: matrix.ruby == '3.3'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ruby-3.3
          path: coverage
          if-no-files-found: error
      - name: Verify gem builds
        run: gem build *.gemspec
