name: Unit tests

on:
  - pull_request
  - push

# Least privilege for fork and same-repo PR runners. No publishing secrets are used.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # setup-ruby plus the suite is normally under a minute. Cap a stuck
    # self-hosted runner so one matrix cell cannot hold it for hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          # Current Ruby. Same required job as 3.x: a 4.0 failure fails the workflow.
          - "4.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run unit tests
        env:
          # One matrix cell publishes the report. Other cells stay unchanged.
          COVERAGE: ${{ matrix.ruby == '3.3' && '1' || '0' }}
        run: bundle exec rake unit
      - name: Publish coverage summary
        if: matrix.ruby == '3.3'
        run: ruby script/report_coverage.rb
      - name: Upload coverage report
        if: matrix.ruby == '3.3'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-ruby-3.3
          path: coverage
          if-no-files-found: error
      - name: Verify gem builds
        run: gem build *.gemspec
